[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "nodejs_18",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.openssl",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.ctype",
  "php82Extensions.fileinfo",
  "php82Extensions.bcmath",
  "php82Extensions.gd"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan storage:link || true ; php artisan config:clear || true ; php artisan config:cache || true ; php artisan route:cache || true ; php artisan view:cache || true ; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
